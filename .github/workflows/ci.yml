name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rust tests
        working-directory: tauri/src-tauri
        run: cargo test --all-targets

      - name: Rust clippy
        working-directory: tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Frontend build
        working-directory: tauri
        run: npm run build

      - name: v1.7 frontend baseline
        run: python scripts/check_v17_frontend_baseline.py

      - name: v2 migration manifest
        run: python scripts/check_v2_migration_manifest.py

      - name: Feature acceptance manifest
        run: python scripts/check_feature_manifest.py

      - name: Tauri command contract
        run: python scripts/check_tauri_command_contract.py

      - name: Frontend data contracts
        run: python scripts/check_frontend_data_contracts.py

      - name: Frontend action contracts
        run: python scripts/check_frontend_action_contracts.py

      - name: Frontend quality regressions
        run: python scripts/check_frontend_quality_regressions.py

      - name: Safety wording
        run: python scripts/check_safety_wording.py

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Safe feature acceptance
        run: python scripts/run_feature_acceptance.py --mode safe

      - name: Upload feature acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-acceptance-reports
          path: artifacts/
          if-no-files-found: warn
