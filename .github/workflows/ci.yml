name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tauri/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Frontend dependencies
        working-directory: tauri
        run: npm ci

      - name: Frontend build
        working-directory: tauri
        run: npm run build

      - name: Rust tests
        working-directory: tauri/src-tauri
        run: cargo test --all-targets

      - name: Rust clippy
        working-directory: tauri/src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Safety wording
        run: python scripts/check_safety_wording.py

      - name: Frontend i18n contracts
        run: python scripts/check_frontend_i18n_contracts.py

      - name: Process identity catalog
        run: python scripts/check_process_identity_catalog.py

      - name: Feature acceptance (static)
        run: python scripts/run_feature_acceptance.py --mode static

      - name: Feature acceptance (safe)
        run: python scripts/run_feature_acceptance.py --mode safe

      - name: Feature acceptance (frontend)
        run: python scripts/run_feature_acceptance.py --mode frontend

      - name: Feature acceptance (report)
        run: python scripts/run_feature_acceptance.py --mode report

      - name: Repository hygiene
        run: python scripts/check_repo_hygiene.py

      - name: Upload acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-acceptance-${{ github.sha }}
          path: |
            artifacts/feature-acceptance-*.json
            artifacts/feature-acceptance-report.md
            artifacts/manual-smoke-checklist.md
            artifacts/isolated-evidence/**
